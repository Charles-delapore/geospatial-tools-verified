name: Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  index-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check index links
        run: python tools/check_index_links.py
